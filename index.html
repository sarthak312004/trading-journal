<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade-Commit</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <nav class="navbar">
        <h1>Trade Commit</h1>
    </nav>

    <main>
        <form action="">
            <h3>/ Add Trade</h3>
            <div class="row-1">
                <input type="date" name="date" id="select-date" required>

                <select name="asset-type" id="select-asset">
                    <option value="" hidden>Select Asset</option>
                    <option value="Equity">Equity</option>
                    <option value="Commodity">Commodity</option>
                    <option value="Crypto">Cypto</option>
                    <option value="Futures">Futures</option>
                    <option value="Forex">Forex</option>
                </select>
                <select name="style-type" id="select-style">
                    <option value="" hidden>Select style</option>
                    <option value="Swing">Swing</option>
                    <option value="Intraday">Intraday</option>
                    <option value="positional">positional</option>
                    <option value="Scalping">Scalping</option>
                </select>
            </div>
            <div class="row-2">

                <select name="timeframe" id="select-TF">
                    <option value="" hidden>Select Time frame</option>
                    <option value="W">W</option>
                    <option value="D">D</option>
                    <option value="4hr">4hr</option>
                    <option value="1hr">1hr</option>
                    <option value="15m">15m</option>
                    <option value="5m">5m</option>
                    <option value="1m">1m</option>
                </select>
                <input type="text" name="asset-name" id="select-asset-name" placeholder="Asset Name">
                <select name="direction" id="select-direction">
                    <option value="" hidden>Direction</option>
                    <option value="Long">long</option>
                    <option value="Short">short</option>
                </select>

            </div>

            <div class="row-3">
                <input type="number" name="entryprice" id="entry-price" placeholder="Entry Price">
                <input type="number" name="exitprice" id="exit-price" placeholder="Exit Price">
                <input type="number" name="quantity" id="enter-qnt" placeholder="Quantity">

            </div>
            <div class="row-4">
                <textarea name="context" id="add-context" rows="" cols="" placeholder="Trade Context"></textarea>
            </div>
            <div class="row-5">
                <label for="file-upload">Upload Screenshot</label>
                <input type="file" id="file-upload" name="uploaded-file">
            </div>

            <div class="row-6">
                <input type="button" onclick="addTrade()" value="Add Trade">
                <input type="reset" name="" id="reset-form" value="Reset">
                <input type="button" onclick="display()" value="Display">
            </div>


        </form>

        <div class="analytics-tab">
            <div class="analytics-heading">
                <h3>/ Analytics</h3>
                <input type="date" title="Filter trades by date" id="filter-date"><button id="filter-btn" onclick="findTrade()">Filter</button>
            </div>
            <div class="analytics-info">
                <p>Master the markets, embrace the discipline, multiply your profits 📈</p>
            </div>
        </div>
    </main>

    <footer>
        <p>Log with discipline</p>
    </footer>
</body>

</html>
